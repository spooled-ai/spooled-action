name: 'Spooled — Behavioral CI for AI Agents'
description: 'Catch behavioral drift in AI agents on every pull request. Fingerprint, diff, and gate against golden baselines.'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  license-key:
    description: 'Spooled Pro license key. Required only for backend features (--push to backend, fetch-from-backend). All comparison features work without it.'
    required: false
    default: ''
  baselines:
    description: 'Path to baseline directory or file'
    required: false
    default: '.github/baselines'
  test-command:
    description: 'Command to generate traces (leave empty if traces already exist)'
    required: false
    default: ''
  trace-dir:
    description: 'Directory containing trace JSONL files'
    required: false
    default: '.spooled/traces'
  policy:
    description: 'Path to policy YAML file'
    required: false
    default: ''
  blocking:
    description: 'Fail the check on incomplete or blocking behavioral decisions'
    required: false
    default: 'true'
  setup-python:
    description: 'Set up Python (disable if already configured)'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.10'
  extra-deps:
    description: 'Path to additional requirements.txt to install'
    required: false
    default: ''
  post-comment:
    description: 'Post or update a PR comment with the report'
    required: false
    default: 'true'
  push-report:
    description: 'Push CI report to Spooled backend'
    required: false
    default: 'false'
  spooled-version:
    description: 'spooled-ai version to install from PyPI. Leave empty to install latest.'
    required: false
    default: ''
  spooled-source:
    description: 'Exact spooled-ai source URL or local path to install. Use this to test an unreleased commit; mutually exclusive with spooled-version.'
    required: false
    default: ''
  fetch-from-backend:
    description: 'Fetch traces from Spooled backend instead of running test-command (Pro, Pattern 4)'
    required: false
    default: 'false'
  agent-id:
    description: 'Agent ID for fetch-from-backend (required when fetch-from-backend is true)'
    required: false
    default: ''
  since:
    description: 'Time window for fetch-from-backend (e.g., "24h", "7d")'
    required: false
    default: '24h'
  commit-sha:
    description: 'Git commit SHA to filter fetched traces (optional)'
    required: false
    default: ''

outputs:
  result:
    description: 'PASS or FAIL'
    value: ${{ steps.enforce.outputs.result }}
  total:
    description: 'Total traces analyzed'
    value: ${{ steps.compare.outputs.total }}
  passed:
    description: 'Traces matching baseline'
    value: ${{ steps.compare.outputs.passed }}
  new-behavior:
    description: 'Traces with new fingerprints'
    value: ${{ steps.compare.outputs.new_behavior }}
  policy-failures:
    description: 'Traces with policy violations'
    value: ${{ steps.compare.outputs.policy_failures }}
  report-path:
    description: 'Path to generated report.md'
    value: ${{ steps.compare.outputs.report_path }}
  summary-path:
    description: 'Path to generated summary.json'
    value: ${{ steps.compare.outputs.summary_path }}
  test-exit-code:
    description: 'Exit code from test-command (empty when no test command ran)'
    value: ${{ steps.generate.outputs.exit_code }}
  compare-exit-code:
    description: 'Exit code from the behavioral comparison'
    value: ${{ steps.compare.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Spooled
      shell: bash
      env:
        SPOOLED_SOURCE_INPUT: ${{ inputs.spooled-source }}
        SPOOLED_VERSION_INPUT: ${{ inputs.spooled-version }}
        SPOOLED_EXTRA_DEPS_INPUT: ${{ inputs.extra-deps }}
        SPOOLED_ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/scripts/install-spooled.sh"

    - name: Validate Action configuration
      id: validate
      shell: bash
      env:
        SPOOLED_POLICY_INPUT: ${{ inputs.policy }}
      run: |
        if [ -n "$SPOOLED_POLICY_INPUT" ] && [ ! -f "$SPOOLED_POLICY_INPUT" ]; then
          echo "exit_code=2" >> "$GITHUB_OUTPUT"
          echo "::error::Configured Spooled policy file not found: $SPOOLED_POLICY_INPUT"
        else
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch traces from backend (Pattern 4)
      if: inputs.fetch-from-backend == 'true' && steps.validate.outputs.exit_code == '0'
      shell: bash
      env:
        SPOOLED_API_KEY: ${{ inputs.license-key }}
        SPOOLED_AGENT_ID_INPUT: ${{ inputs.agent-id }}
        SPOOLED_SINCE_INPUT: ${{ inputs.since }}
        SPOOLED_TRACE_DIR_INPUT: ${{ inputs.trace-dir }}
        SPOOLED_COMMIT_SHA_INPUT: ${{ inputs.commit-sha }}
      run: |
        fetch_args=(
          spooled ci fetch-traces
          --agent-id "$SPOOLED_AGENT_ID_INPUT"
          --since "$SPOOLED_SINCE_INPUT"
          --out-dir "$SPOOLED_TRACE_DIR_INPUT"
        )
        if [ -n "$SPOOLED_COMMIT_SHA_INPUT" ]; then
          fetch_args+=(--commit-sha "$SPOOLED_COMMIT_SHA_INPUT")
        fi

        "${fetch_args[@]}"

    - name: Generate traces
      id: generate
      if: inputs.test-command != '' && inputs.fetch-from-backend != 'true' && steps.validate.outputs.exit_code == '0'
      shell: bash
      env:
        SPOOLED_LOCAL_STORAGE: 'true'
        SPOOLED_TEST_COMMAND: ${{ inputs.test-command }}
      run: |
        # Preserve the test result while still producing the behavioral report.
        # Passing the command through the environment also preserves multiline
        # commands without interpolating them into this shell program.
        set +e
        bash -o pipefail -c "$SPOOLED_TEST_COMMAND"
        TEST_EXIT=$?
        set -e

        echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"
        if [ "$TEST_EXIT" -ne 0 ]; then
          echo "::error::Spooled trace command failed with exit code $TEST_EXIT"
        fi
        exit 0

    - name: Compare traces against baselines
      id: compare
      shell: bash
      env:
        SPOOLED_LOCAL_STORAGE: 'true'
        SPOOLED_BACKEND_URL: ''
        SPOOLED_API_KEY: ${{ inputs.license-key }}
        SPOOLED_BASELINES_INPUT: ${{ inputs.baselines }}
        SPOOLED_TRACE_DIR_INPUT: ${{ inputs.trace-dir }}
        SPOOLED_POLICY_INPUT: ${{ inputs.policy }}
        SPOOLED_BLOCKING_INPUT: ${{ inputs.blocking }}
        SPOOLED_PUSH_REPORT_INPUT: ${{ inputs.push-report }}
        SPOOLED_CONFIG_EXIT: ${{ steps.validate.outputs.exit_code }}
      run: |
        # All comparison features (blocking, annotations, full PR comment) are
        # available on Free. Pro is only required for backend trace ingest and
        # the --push flag (handled at the CLI layer).
        compare_args=(
          spooled ci batch-compare
          --trace-dir "$SPOOLED_TRACE_DIR_INPUT"
          --baseline "$SPOOLED_BASELINES_INPUT"
          --out ci-report
          --github-annotations
        )

        if [ "$SPOOLED_BLOCKING_INPUT" == "true" ]; then
          compare_args+=(--enable-blocking)
        else
          compare_args+=(--no-blocking)
        fi

        if [ -n "$SPOOLED_POLICY_INPUT" ]; then
          compare_args+=(--policy "$SPOOLED_POLICY_INPUT")
        fi

        if [ "$SPOOLED_PUSH_REPORT_INPUT" == "true" ]; then
          compare_args+=(--push)
        fi

        if [ "$SPOOLED_CONFIG_EXIT" -ne 0 ]; then
          CLI_EXIT="$SPOOLED_CONFIG_EXIT"
        else
          set +e
          "${compare_args[@]}"
          CLI_EXIT=$?
          set -e
        fi

        echo "exit_code=$CLI_EXIT" >> "$GITHUB_OUTPUT"

        # Parse summary.json to set outputs. A missing summary stays FAIL and
        # is enforced by the final gate step.
        if [ -f ci-report/summary.json ]; then
          python3 -c "
        import json, os
        with open('ci-report/summary.json') as f:
            s = json.load(f)
        out = os.environ.get('GITHUB_OUTPUT', '')
        if out:
            with open(out, 'a') as f:
                f.write(f\"result={s['overall_result']}\n\")
                f.write(f\"total={s['total_traces']}\n\")
                f.write(f\"passed={s['passed']}\n\")
                f.write(f\"new_behavior={s['new_behavior']}\n\")
                f.write(f\"policy_failures={s['policy_failures']}\n\")
                f.write(f\"report_path=ci-report/report.md\n\")
                f.write(f\"summary_path=ci-report/summary.json\n\")
        "
        else
          mkdir -p ci-report
          python3 -c "
        import json
        from pathlib import Path
        exit_code = int('${CLI_EXIT}')
        summary = {
            'overall_result': 'FAIL',
            'total_traces': 0,
            'discovered_traces': 0,
            'analyzed_traces': 0,
            'unanalyzed_traces': 0,
            'analysis_failures': 1,
            'passed': 0,
            'new_behavior': 0,
            'no_baseline': 0,
            'policy_failures': 0,
            'blocking_decisions': 1,
            'failure_reason': (
                'Configured policy file is missing'
                if exit_code == 2
                else 'Behavioral comparison did not produce a complete report'
            ),
            'traces': [],
        }
        Path('ci-report/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
        Path('ci-report/report.md').write_text(
            '## ❌ Spooled Behavioral CI: **FAIL**\n\n'
            + summary['failure_reason']
            + '. Review the Action log, correct the configuration, and rerun.\n'
        )
        "
          echo "result=FAIL" >> "$GITHUB_OUTPUT"
          echo "total=0" >> "$GITHUB_OUTPUT"
          echo "passed=0" >> "$GITHUB_OUTPUT"
          echo "new_behavior=0" >> "$GITHUB_OUTPUT"
          echo "policy_failures=0" >> "$GITHUB_OUTPUT"
          echo "report_path=ci-report/report.md" >> "$GITHUB_OUTPUT"
          echo "summary_path=ci-report/summary.json" >> "$GITHUB_OUTPUT"
        fi

        # Keep the composite action alive long enough to post the report and
        # upload artifacts. The final step owns the action's exit status.
        exit 0

    - name: Job summary
      if: always() && hashFiles('ci-report/report.md') != ''
      shell: bash
      run: cat ci-report/report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR comment
      if: always() && inputs.post-comment == 'true' && github.event_name == 'pull_request' && hashFiles('ci-report/report.md') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/scripts/post-pr-comment.sh"

    - name: Upload reports
      if: always() && hashFiles('ci-report/') != ''
      uses: actions/upload-artifact@v4
      with:
        name: spooled-baseline-report
        path: ci-report/
        retention-days: 30
        if-no-files-found: ignore

    - name: Enforce Spooled gate
      id: enforce
      if: always()
      shell: bash
      run: |
        TEST_EXIT="${{ steps.generate.outputs.exit_code }}"
        COMPARE_EXIT="${{ steps.compare.outputs.exit_code }}"
        CONFIG_EXIT="${{ steps.validate.outputs.exit_code }}"

        if [ -n "$CONFIG_EXIT" ] && [ "$CONFIG_EXIT" -ne 0 ]; then
          echo "result=FAIL" >> "$GITHUB_OUTPUT"
          echo "::error::Spooled Action configuration is invalid"
          exit "$CONFIG_EXIT"
        fi

        if [ -n "$TEST_EXIT" ] && [ "$TEST_EXIT" -ne 0 ]; then
          echo "result=FAIL" >> "$GITHUB_OUTPUT"
          echo "::error::Trace generation failed with exit code $TEST_EXIT"
          exit "$TEST_EXIT"
        fi

        if [ -z "$COMPARE_EXIT" ]; then
          echo "result=FAIL" >> "$GITHUB_OUTPUT"
          echo "::error::Spooled comparison did not complete"
          exit 1
        fi

        if [ "$COMPARE_EXIT" -ne 0 ]; then
          echo "result=FAIL" >> "$GITHUB_OUTPUT"
          echo "::error::Spooled blocked this change; review the report above"
          exit "$COMPARE_EXIT"
        fi

        echo "result=PASS" >> "$GITHUB_OUTPUT"
